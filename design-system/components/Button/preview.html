<!-- @dsCard group="Actions" height=120 subtitle="Pill buttons: primary, outline" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-6); }
  .btn {
    display: inline-flex; align-items: center; gap: var(--space-2);
    padding: 12px 22px; border-radius: var(--radius-full);
    font: 500 14px/20px var(--font-sans); text-decoration: none; cursor: pointer;
    border: 1px solid transparent;
  }
  .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
  .primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
  .outline { background: transparent; color: var(--foreground); border-color: var(--border); }
  .outline:hover { border-color: var(--accent); }
</style>
<div class="row">
  <a class="btn primary" href="#">Let's talk</a>
  <a class="btn outline" href="#">See the work</a>
  <a class="btn primary" href="#">Take the free audit ✦</a>
</div>
