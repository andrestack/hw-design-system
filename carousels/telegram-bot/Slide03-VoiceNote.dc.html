<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>The fix: send a voice note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#1fa6a0}a:hover{color:#f3f1e6}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; display: flex; flex-direction: column; font-family: 'Geist', system-ui, sans-serif; color: #e9efe3; background: #143144; overflow: hidden">
  <span style="font-size: 24px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9fb4ae">The fix</span>
  <h2 style="margin: 40px 0 0; font-size: 80px; line-height: 1.04; font-weight: 600; letter-spacing: -0.03em; color: #f3f1e6; text-wrap: balance">The team just sends a <em style="font-family: ui-serif, Georgia, Cambria, serif; color: #1fa6a0">voice note</em>.</h2>
  <p style="margin: 36px 0 0; max-width: 860px; font-size: 36px; line-height: 1.45; color: #9fb4ae">From the van, the yard or the pool fence. The bot only accepts voice notes, so there's nothing to type and nothing to fill in.</p>
  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 20px">
    <div style="display: flex; align-items: center; gap: 28px; padding: 28px 36px 28px 28px; background: #17434a; border: 1px solid #24475c; border-radius: 48px 48px 12px 48px">
      <div style="width: 96px; height: 96px; flex: none; border-radius: 9999px; background: #1fa6a0; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="#0e2431"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; height: 80px">
        <sc-for list="{{bars}}" as="bar" hint-placeholder-count="30">
          <span style="width: 8px; border-radius: 9999px; background: #e9efe3; height: {{bar.h}}"></span>
        </sc-for>
      </div>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 28px; font-weight: 500; color: #c3d1cb">0:09</span>
    </div>
    <span style="font-size: 26px; color: #9fb4ae">Sent from the van · 7:42 am</span>
    <div style="margin-top: 20px; display: flex; align-items: center; gap: 14px; padding: 16px 28px; border: 1px solid #24475c; border-radius: 9999px; font-size: 26px; color: #e9efe3">
      <span style="color: #d9b24c">✦</span>
      <span>Typed messages: not accepted</span>
    </div>
  </div>
  <div style="margin-top: 72px; display: flex; align-items: center; gap: 20px; font-size: 28px; font-weight: 600; color: #e9efe3">
    <img src="/_blob/0dbef1ffcb052e77ef2890affdf3d0a6" alt="Hinterland Web logo" style="width: 56px; height: 56px">
    <span>Hinterland Web</span>
    <span style="margin-left: auto; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 26px; font-weight: 500; color: #9fb4ae">03 / 08</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const hs = [18, 34, 52, 30, 64, 44, 72, 38, 56, 26, 48, 70, 40, 58, 32, 66, 46, 24, 54, 36, 62, 28, 50, 20, 42, 34, 26, 18, 30, 14];
    return { bars: hs.map((h) => ({ h: h + 'px' })) };
  }
}
</script>
</body>
</html>
